[tool.coverage.run]
source = ["backend"]
omit = ["backend/test_*.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"backend/main.py" = ["E402"]
"backend/test_*.py" = ["E402"]
